name: binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target.key }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { key: linux-x64,     bun: bun-linux-x64,     ext: "",     runner: ubuntu-22.04,    can_run: true  }
          - { key: linux-arm64,   bun: bun-linux-arm64,   ext: "",     runner: ubuntu-22.04,    can_run: false }
          - { key: darwin-arm64,  bun: bun-darwin-arm64,  ext: "",     runner: macos-14,        can_run: true  }
          # darwin-x64 cross-compiles on the Apple Silicon runner; smoke is
          # skipped because the produced x86_64 Mach-O can't run natively on
          # arm64. The macos-13 hosted pool starved out during v1.4.0 (job
          # sat queued >25 min with no runner assigned).
          - { key: darwin-x64,    bun: bun-darwin-x64,    ext: "",     runner: macos-14,        can_run: false }
          - { key: windows-x64,   bun: bun-windows-x64,   ext: ".exe", runner: windows-2022,    can_run: true  }
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        # Bun reads package-lock.json directly; no separate bun.lock is
        # committed since the project's source-of-truth lockfile is npm's.
        run: bun install --no-save
        shell: bash

      - name: Build ${{ matrix.target.key }} binary
        run: bun scripts/build-binaries.ts ${{ matrix.target.key }}
        shell: bash

      - name: Smoke — verify --version matches package.json (POSIX)
        if: matrix.target.can_run && runner.os != 'Windows'
        run: |
          set -eu
          BIN="dist-bin/vibespot-${{ matrix.target.key }}${{ matrix.target.ext }}"
          chmod +x "$BIN"
          EXPECTED=$(node -p "require('./package.json').version")
          GOT=$("$BIN" --version)
          echo "expected=$EXPECTED got=$GOT"
          test "$EXPECTED" = "$GOT"
        shell: bash

      - name: Smoke — verify --version matches package.json (Windows)
        if: matrix.target.can_run && runner.os == 'Windows'
        run: |
          $bin = "dist-bin/vibespot-${{ matrix.target.key }}${{ matrix.target.ext }}"
          $expected = (Get-Content package.json | ConvertFrom-Json).version
          $got = & $bin --version
          Write-Host "expected=$expected got=$got"
          if ($expected -ne $got) { exit 1 }
        shell: pwsh

      - name: Smoke — start server, hit /healthz (POSIX)
        if: matrix.target.can_run && runner.os != 'Windows'
        env:
          VIBESPOT_NO_OPEN: "1"
        run: |
          set -eu
          BIN="dist-bin/vibespot-${{ matrix.target.key }}${{ matrix.target.ext }}"
          "$BIN" > /tmp/vibespot.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4200/healthz > /tmp/healthz.json; then
              echo "/healthz responded after ${i}s"
              cat /tmp/healthz.json
              echo
              break
            fi
            sleep 1
            if [ "$i" = "30" ]; then
              echo "no /healthz response after 30s"
              cat /tmp/vibespot.log || true
              exit 1
            fi
          done
        shell: bash

      - name: Smoke — start server, hit /healthz (Windows)
        if: matrix.target.can_run && runner.os == 'Windows'
        env:
          VIBESPOT_NO_OPEN: "1"
        run: |
          $bin = "dist-bin/vibespot-${{ matrix.target.key }}${{ matrix.target.ext }}"
          $proc = Start-Process -FilePath $bin -RedirectStandardOutput vibespot.log -RedirectStandardError vibespot.err.log -PassThru -NoNewWindow
          try {
            $ok = $false
            for ($i = 1; $i -le 30; $i++) {
              try {
                $resp = Invoke-WebRequest -Uri "http://127.0.0.1:4200/healthz" -UseBasicParsing -TimeoutSec 5
                if ($resp.StatusCode -eq 200) {
                  Write-Host "/healthz responded after ${i}s"
                  Write-Host $resp.Content
                  $ok = $true
                  break
                }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ok) {
              Write-Host "no /healthz response after 30s"
              Get-Content vibespot.log -ErrorAction SilentlyContinue
              Get-Content vibespot.err.log -ErrorAction SilentlyContinue
              exit 1
            }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
        shell: pwsh

      # Always upload artifact so downstream jobs (package-macos-app) can
      # consume the darwin binaries via download-artifact. On tag pushes the
      # binary is also attached to the GitHub Release in the next step.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibespot-${{ matrix.target.key }}
          path: dist-bin/vibespot-${{ matrix.target.key }}${{ matrix.target.ext }}
          retention-days: 14

      - name: Attach binary to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-bin/vibespot-${{ matrix.target.key }}${{ matrix.target.ext }}
          fail_on_unmatched_files: true

  package-macos-app:
    name: package macOS .app bundle
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Download darwin-arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: vibespot-darwin-arm64
          path: dist-bin

      - name: Download darwin-x64 binary
        uses: actions/download-artifact@v4
        with:
          name: vibespot-darwin-x64
          path: dist-bin

      - name: Make bare binaries executable
        run: chmod +x dist-bin/vibespot-darwin-arm64 dist-bin/vibespot-darwin-x64

      - name: Package vibeSpot.app (universal, ad-hoc signed, zipped)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          bun scripts/build-macos-app.ts \
            --arm64 dist-bin/vibespot-darwin-arm64 \
            --x64   dist-bin/vibespot-darwin-x64 \
            --version "$VERSION" \
            --out   "dist-bin/vibeSpot-macos.app.zip"
          ls -lh dist-bin/vibeSpot-macos.app.zip

      - name: Smoke — universal Mach-O has both architectures
        run: |
          # Pull the universal binary back out of the staging dir created by
          # the packaging script and confirm `lipo` reports both slices.
          lipo -archs dist-bin/.macos-stage/vibespot-universal
          lipo -archs dist-bin/.macos-stage/vibespot-universal | grep -q 'x86_64'
          lipo -archs dist-bin/.macos-stage/vibespot-universal | grep -q 'arm64'

      - name: Smoke — .app launches and serves /healthz
        run: |
          set -eu
          # Unzip into a clean dir and try to spawn the bundled binary.
          # macos-14 is arm64 so this exercises the arm64 slice.
          mkdir -p /tmp/app-smoke && cd /tmp/app-smoke
          ditto -x -k "$GITHUB_WORKSPACE/dist-bin/vibeSpot-macos.app.zip" .
          ls -la vibeSpot.app/Contents/MacOS vibeSpot.app/Contents/Resources
          BIN="$PWD/vibeSpot.app/Contents/MacOS/vibespot"
          VIBESPOT_NO_OPEN=1 "$BIN" > /tmp/app.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4200/healthz > /tmp/healthz.json; then
              echo ".app /healthz responded after ${i}s"
              cat /tmp/healthz.json
              echo
              break
            fi
            sleep 1
            if [ "$i" = "30" ]; then
              echo "no /healthz response after 30s"
              cat /tmp/app.log || true
              exit 1
            fi
          done

      - name: Upload .app.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibeSpot-macos.app
          path: dist-bin/vibeSpot-macos.app.zip
          retention-days: 14

      - name: Attach .app.zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-bin/vibeSpot-macos.app.zip
          fail_on_unmatched_files: true
