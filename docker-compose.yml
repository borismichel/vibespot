# docker-compose bundle for the single-customer EU hosted vibespot deployment.
#
# Usage:
#   cp .env.example .env   # fill in the secrets
#   docker compose up -d
#
# This compose file is intentionally batteries-included: Caddy terminates TLS
# and reverse-proxies to vibespot, filesystem volumes persist app state, and
# oauth2-proxy is wired in as a placeholder so the upstream auth gate
# (separate issue under VIB-446) can drop in without a topology change.

x-restart: &restart unless-stopped

services:
  vibespot:
    image: ghcr.io/borismichel/vibespot:${VIBESPOT_IMAGE_TAG:-latest}
    # Uncomment to build locally instead of pulling from GHCR:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: vibespot
    restart: *restart
    environment:
      VIBESPOT_PORT: "4200"
      VIBESPOT_NO_OPEN: "1"
      # In-container bind must be 0.0.0.0 so Caddy can reach it; the port is
      # only `expose`d to the compose network, never published to the host.
      VIBESPOT_HOST: "0.0.0.0"
      # Shared-secret access token (VIB-1889). Leave empty to have the server
      # generate one at boot — grab the tokenized URL from `docker logs vibespot`.
      VIBESPOT_AUTH_TOKEN: ${VIBESPOT_AUTH_TOKEN:-}
      # Browser-facing URLs behind Caddy (VIB-1933). The live preview runs on
      # a separate origin (app port + 2 → 4202 in-container, VIB-1892); Caddy
      # proxies it under its own hostname and the app announces that public
      # https URL via /api/preview-origin instead of synthesizing an
      # unreachable http://<host>:4202. VIBESPOT_PUBLIC_ORIGIN additionally
      # pins the preview's frame-ancestors CSP to the app origin (not `*`).
      VIBESPOT_PUBLIC_ORIGIN: "https://${VIBESPOT_DOMAIN:-localhost}"
      VIBESPOT_PREVIEW_PUBLIC_ORIGIN: "https://${VIBESPOT_PREVIEW_DOMAIN:-preview.${VIBESPOT_DOMAIN:-localhost}}"
      NODE_ENV: production
      # AI provider keys — at least one must be set for end-to-end generation.
      VIBESPOT_AI_ENGINE: ${VIBESPOT_AI_ENGINE:-langdock-api}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LANGDOCK_API_KEY: ${LANGDOCK_API_KEY:-}
      LANGDOCK_PROVIDER: ${LANGDOCK_PROVIDER:-}
      LANGDOCK_BASE_URL: ${LANGDOCK_BASE_URL:-}
      # HubSpot Personal Access Key for theme uploads.
      HUBSPOT_PERSONAL_ACCESS_KEY: ${HUBSPOT_PERSONAL_ACCESS_KEY:-}
    volumes:
      - vibespot-config:/home/vibespot/.vibespot
      - vibespot-workspace:/workspace
    expose:
      - "4200"
      # Live-preview origin (VIB-1892/VIB-1933) — compose-network only, Caddy
      # fronts it under the preview hostname; never publish it to the host.
      - "4202"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4200/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Azure Entra (Entra ID) SSO gate (VIB-1871). Disabled by default via the
  # `auth` profile so a plain `docker compose up` runs ungated, exactly as
  # before. To turn the gate on, layer in the override that also re-points
  # Caddy at this service:
  #   docker compose --profile auth -f docker-compose.yml -f docker-compose.auth.yml up -d
  # See `.env.example` (Entra SSO section) and docs/docker-deployment.md.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: vibespot-oauth2-proxy
    restart: *restart
    profiles: ["auth"]
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_UPSTREAMS: "http://vibespot:4200"
      # Carry the chat WebSocket upgrade (and its auth cookie) through to the
      # app. Default in v7 is already true; pinned here so the gate provably
      # proxies the chat socket end-to-end (VIB-1871 acceptance).
      OAUTH2_PROXY_PROXY_WEBSOCKETS: "true"
      # Let unauthenticated health probes through so external monitors/LBs
      # hitting /healthz get 200, not a 302 to the Entra login.
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: "^/healthz$$"
      # Sits behind Caddy, which terminates TLS — trust its X-Forwarded-* so
      # the login redirect is built with the correct public https scheme.
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      # Entra is the only IdP — skip the interstitial and go straight to login.
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_SCOPE: ${OAUTH2_SCOPE:-openid email profile}
      # Forward the authenticated identity downstream to vibespot. Harmless
      # today (the app ignores it) and the hook a later per-user RLS step
      # consumes — see VIB-1870.
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_PROVIDER: ${OAUTH2_PROVIDER:-oidc}
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_CLIENT_ID:-}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET:-}
      # Membership is enforced primarily by the TENANT-SCOPED issuer URL below
      # (only your org's users can authenticate). EMAIL_DOMAINS is a second
      # filter and defaults EMPTY — fail closed, never `*`. Set it to your
      # org's domain(s) in .env so a stray guest the tenant admits still can't
      # reach the UI. Use `*` explicitly only if you truly want every tenant
      # user (the issuer already scopes that to your org).
      OAUTH2_PROXY_EMAIL_DOMAINS: ${OAUTH2_EMAIL_DOMAINS:-}
      OAUTH2_PROXY_REDIRECT_URL: ${OAUTH2_REDIRECT_URL:-}
      # Entra v2: https://login.microsoftonline.com/<TENANT_ID>/v2.0
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OAUTH2_ISSUER_URL:-}
    depends_on:
      - vibespot
    expose:
      - "4180"

  caddy:
    image: caddy:2-alpine
    container_name: vibespot-caddy
    restart: *restart
    ports:
      - "80:80"
      - "443:443"
    environment:
      VIBESPOT_DOMAIN: ${VIBESPOT_DOMAIN:-localhost}
      VIBESPOT_TLS_EMAIL: ${VIBESPOT_TLS_EMAIL:-}
      VIBESPOT_UPSTREAM: ${VIBESPOT_UPSTREAM:-vibespot:4200}
      # Second site: the live-preview origin (VIB-1933). Defaults to a
      # `preview.` subdomain of the app domain — point DNS at the host for it
      # too when using a real domain. Must match VIBESPOT_PREVIEW_PUBLIC_ORIGIN
      # announced by the vibespot service above.
      VIBESPOT_PREVIEW_DOMAIN: ${VIBESPOT_PREVIEW_DOMAIN:-preview.${VIBESPOT_DOMAIN:-localhost}}
      VIBESPOT_PREVIEW_UPSTREAM: ${VIBESPOT_PREVIEW_UPSTREAM:-vibespot:4202}
    volumes:
      - ./compose/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - vibespot

volumes:
  vibespot-config:
  vibespot-workspace:
  caddy-data:
  caddy-config:
